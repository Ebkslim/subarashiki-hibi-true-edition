[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secscraper"
version = "0.1.0"
description = "Scrape SEC laws/rules and EDGAR filings into a local SQLite + FTS5 searchable database."
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pypdf>=4.0",
]

[project.scripts]
secscraper = "secscraper.cli:main"

[tool.setuptools.packages.find]
include = ["secscraper*"]
